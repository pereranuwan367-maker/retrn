<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#2563eb">

  <title>Cloud Online Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #f5f7fb;
      overflow: hidden;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #appFrame {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
      height: 100dvh;

      border: 0;
      display: block;

      background: #ffffff;
    }

    #mobileOpen {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        linear-gradient(
          135deg,
          #eff6ff 0%,
          #f5f3ff 50%,
          #fdf2f8 100%
        );

      z-index: 99999;
    }

    .mobile-card {
      width: 100%;
      max-width: 390px;

      background: rgba(255,255,255,.95);

      border-radius: 28px;

      padding: 30px 24px;

      text-align: center;

      box-shadow:
        0 25px 70px
        rgba(15,23,42,.15);

      border:
        1px solid
        rgba(255,255,255,.9);
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      border-radius: 22px;

      display: grid;
      place-items: center;

      color: white;

      font-size: 34px;
      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed,
          #ec4899
        );

      box-shadow:
        0 15px 35px
        rgba(37,99,235,.25);
    }

    .title {
      font-size: 24px;
      font-weight: 900;

      color: #172033;
    }

    .text {
      margin-top: 10px;

      color: #64748b;

      line-height: 1.6;

      font-size: 14px;
    }

    .open-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      min-height: 52px;

      margin-top: 22px;

      border: 0;

      border-radius: 15px;

      background: #111827;

      color: white;

      text-decoration: none;

      font-size: 15px;

      font-weight: 800;
    }

    .open-btn:active {
      transform: scale(.98);
    }

    .fallback {
      margin-top: 14px;

      font-size: 12px;

      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div id="mobileOpen">

    <div class="mobile-card">

      <div class="logo">
        ☁
      </div>

      <div class="title">
        Cloud Online Shop
      </div>

      <div class="text">
        Opening Returns / Refunds...
      </div>

      <a
        id="openButton"
        class="open-btn"
        href="#"
      >
        Open Returns / Refunds
      </a>

      <div class="fallback">
        Please tap the button if the page does not open automatically.
      </div>

    </div>

  </div>


  <iframe
    id="appFrame"
    title="Cloud Online Shop Returns / Refunds"
    allow="camera; microphone; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>


  <script>

    /*
     * ===============================================
     * IMPORTANT
     * ===============================================
     *
     * Put your Google Apps Script Web App URL here.
     *
     * Example:
     * https://script.google.com/macros/s/ABC123.../exec
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbze1kR5LMYeI6JPkAjiTHPxrSfmvADw4aGdo8XLszQFmAFtJHTpaMN1lz7GyXmByM3ACg/exec";


    const appFrame =
      document.getElementById("appFrame");

    const mobileOpen =
      document.getElementById("mobileOpen");

    const openButton =
      document.getElementById("openButton");


    const CUSTOMER_URL =
      APPS_SCRIPT_URL +
      "?page=index";


    openButton.href =
      CUSTOMER_URL;


    function isMobile() {

      return (
        /Android/i.test(
          navigator.userAgent
        ) ||

        /iPhone/i.test(
          navigator.userAgent
        ) ||

        /iPad/i.test(
          navigator.userAgent
        ) ||

        /iPod/i.test(
          navigator.userAgent
        )
      );

    }


    function openMobileApp() {

      /*
       * Direct navigation.
       *
       * This is important because google.script.run
       * belongs to Apps Script HTML Service.
       */

      window.location.replace(
        CUSTOMER_URL
      );

    }


    /*
     * MOBILE
     *
     * GitHub page -> direct Apps Script
     */

    if (isMobile()) {

      appFrame.style.display =
        "none";

      mobileOpen.style.display =
        "flex";

      setTimeout(
        openMobileApp,
        400
      );

    }


    /*
     * DESKTOP / LAPTOP
     *
     * GitHub page -> iframe -> Apps Script
     */

    else {

      appFrame.src =
        CUSTOMER_URL;

    }


    /*
     * Prevent blank iframe if the browser
     * takes a moment to start loading.
     */

    window.addEventListener(
      "load",
      function () {

        if (!isMobile()) {

          if (!appFrame.src) {

            appFrame.src =
              CUSTOMER_URL;

          }

        }

      }
    );

  </script>

</body>
</html>
