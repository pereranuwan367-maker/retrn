<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>Cloud Online Shop</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100dvh;

      min-width: 100%;
      min-height: 100%;

      border: 0;
      outline: 0;

      pointer-events: auto;

      touch-action: manipulation;

      background: #ffffff;
    }

    /* Important for mobile browsers */
    iframe {
      pointer-events: auto !important;
      touch-action: manipulation !important;
    }

    @supports not (height: 100dvh) {
      #appFrame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbze1kR5LMYeI6JPkAjiTHPxrSfmvADw4aGdo8XLszQFmAFtJHTpaMN1lz7GyXmByM3ACg/exec?page=index"
    title="Cloud Online Shop"
    allow="fullscreen"
    scrolling="yes">
  </iframe>

</body>
</html>
